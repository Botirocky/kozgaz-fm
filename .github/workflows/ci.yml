name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  teszt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Qt függőségek (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run --no-sync ruff check src tests eszkozok
      - run: uv run --no-sync pytest -q

  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: PHP és eszközök
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends php-cli php-intl php-sqlite3 php-mbstring qrencode
      - run: uv venv && uv pip install -e .
      - name: Mintaadatok az asztali változatból
        run: |
          mkdir -p php/tests/adat
          uv run --no-sync python php/tests/eszkozok/orarend_minta.py > php/tests/adat/orarend_minta.json
          uv run --no-sync python php/tests/eszkozok/szuro_minta.py > php/tests/adat/szuro_minta.json
      - name: Szintaxis
        run: find php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: php php/tests/futtat.php
