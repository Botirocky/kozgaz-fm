name: Kiadás

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - src/kozgaz_fm/__init__.py
      - .github/workflows/kiadas.yml
  workflow_dispatch:
    inputs:
      cimke:
        description: "Kiadás címkéje (pl. v1.6.0); üresen csak épít"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  cimke:
    runs-on: ubuntu-24.04
    outputs:
      cimke: ${{ steps.c.outputs.cimke }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        env:
          KEZI: ${{ inputs.cimke }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            cimke="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            cimke="$KEZI"
          else
            cimke="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/kozgaz_fm/__init__.py)"
            if [ -n "$(git ls-remote --tags origin "refs/tags/$cimke")" ]; then
              cimke=""
            fi
          fi
          echo "cimke=$cimke" >> "$GITHUB_OUTPUT"
          echo "Kiadás címkéje: ${cimke:-nincs}"

  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run --no-sync pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/kozgaz-fm.spec
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Telepítő
        shell: pwsh
        run: |
          $verzio = (uv run --no-sync python -c "import kozgaz_fm; print(kozgaz_fm.__version__)").Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$verzio" packaging\windows\telepito.iss
          Compress-Archive -Path dist\KozgazFM -DestinationPath "dist\KozgazFM-$verzio-windows-hordozhato.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-telepito.exe
            dist/*-hordozhato.zip

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libpulse0
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/kozgaz-fm.spec
      - name: Csomag
        run: |
          verzio=$(uv run --no-sync python -c "import kozgaz_fm; print(kozgaz_fm.__version__)")
          nev="KozgazFM-$verzio-linux-x86_64"
          mkdir -p "csomag/$nev/ikonok"
          cp -a dist/KozgazFM "csomag/$nev/"
          cp packaging/linux/telepites.sh packaging/linux/kozgaz-fm.desktop LICENSE "csomag/$nev/"
          cp src/kozgaz_fm/sugo.md "csomag/$nev/HASZNALATI-UTMUTATO.md"
          cp assets/ikon-*.png "csomag/$nev/ikonok/"
          tar -C csomag -czf "dist/$nev.tar.gz" "$nev"
      - name: Debian-csomag
        run: |
          packaging/debian/epit-deb.sh dist/KozgazFM dist
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | head -20
      - name: Zenekérő szerver Debian-csomag
        run: |
          zenekeres-szerver/debian/epit-deb.sh dist
          dpkg-deb --info dist/kozgaz-fm-szerver_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb

  wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  pi-os:
    needs: wheel
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - name: Lemezkép építése
        env:
          ADMIN_JELSZO: kozgazfm
        run: sudo -E pi-os/belso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pi-os
          path: dist/KozgazFM-OS-*.img.xz
          compression-level: 0

  kiadas:
    if: needs.cimke.outputs.cimke != ''
    needs: [cimke, windows, linux, wheel, pi-os]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CIMKE: ${{ needs.cimke.outputs.cimke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Változások listája
        run: |
          elozo=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || true)
          tartomany="${elozo:+$elozo..}HEAD"
          {
            echo "## Változások"
            echo
            git log --no-merges --reverse --format='%s%n%b' "$tartomany" \
              | grep -v -e '^Co-Authored-By:' -e '^Claude-Session:' -e '^[[:space:]]*$' \
              | sed -e 's/^  \([^ -]\)/    \1/' -e 's/^- /  - /' -e '/^ /!s/^/- /'
          } > valtozasok.md
          cat valtozasok.md
      - uses: actions/download-artifact@v4
        with:
          path: kiadas
          merge-multiple: true
      - name: Ellenőrzőösszegek
        run: cd kiadas && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CIMKE }}
          name: ${{ env.CIMKE }}
          target_commitish: ${{ github.sha }}
          files: kiadas/*
          body_path: valtozasok.md
